plugins { id 'com.android.application' }

def signingFile = rootProject.file('signing.properties')
def signing = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }

android {
    namespace 'com.ondrejhlavacek.cubetimer'
    compileSdk 36
    defaultConfig {
        applicationId 'com.ondrejhlavacek.cubetimer'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '1.1.0'
    }
    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile rootProject.file(signing.getProperty('storeFile'))
                storePassword signing.getProperty('storePassword')
                keyAlias signing.getProperty('keyAlias')
                keyPassword signing.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release { if (signingFile.exists()) signingConfig signingConfigs.release }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name.toLowerCase().contains('release') } && !signingFile.exists() && !project.hasProperty('unsignedRelease')) {
        throw new GradleException('Release builds require signing.properties with storeFile, storePassword, keyAlias and keyPassword.')
    }
}
